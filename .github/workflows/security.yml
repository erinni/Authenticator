name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Ogni giorno: nuove advisory possono riguardare dipendenze già presenti.
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cargo-deny:
    name: cargo-deny (advisories, licenze, ban, sorgenti)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: cargo-deny@0.20.2
      - run: cargo deny --locked check

  pnpm-audit:
    name: pnpm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: pnpm audit --audit-level=moderate

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          deny-licenses: AGPL-1.0, SSPL-1.0, BUSL-1.1
          # glib 0.18 (gtk-rs, tramite Tauri su Linux): unsoundness in `VariantStrIter`, API che
          # nessuna dipendenza usa. Corretta solo in glib 0.20, che Tauri 2 (GTK 3) non adotta.
          allow-ghsas: GHSA-wrw7-89jp-8q8g

  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      # Richiesto da CodeQL per leggere i dettagli del workflow run nelle repository private.
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [rust, javascript-typescript, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ matrix.language }}

  fuzz:
    name: Fuzzing (smoke)
    runs-on: ubuntu-latest
    env:
      # Nightly fissato a una data per build riproducibili; aggiornarlo manualmente.
      NIGHTLY: nightly-2026-10-22
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install "$NIGHTLY" --profile minimal
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: cargo-fuzz@0.13.2
      - name: Esegui ogni target
        run: |
          for target in $(cargo +"$NIGHTLY" fuzz list --fuzz-dir fuzz); do
            echo "::group::$target"
            # Target esplicito: il binario precompilato di cargo-fuzz è musl e userebbe
            # x86_64-unknown-linux-musl, incompatibile con AddressSanitizer.
            cargo +"$NIGHTLY" fuzz run --fuzz-dir fuzz --target x86_64-unknown-linux-gnu "$target" -- -max_total_time=60
            echo "::endgroup::"
          done
