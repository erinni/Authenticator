[package]
name = "authenticator-native"
description = "App desktop (Tauri 2): il core gira nativo, la UI è quella della PWA."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "authenticator_native"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", default-features = false, features = ["config-json"] }

[dependencies]
authenticator-core.workspace = true
authenticator-session = { path = "../../../crates/session" }
serde = { version = "1.0.229", default-features = false, features = ["derive", "std"] }
# Senza "dynamic-acl": i permessi sono risolti alla compilazione e non modificabili a runtime.
tauri = { version = "2.12.5", default-features = false, features = ["wry", "compression", "common-controls-v6", "x11"] }
zeroize = "1.9.1"

[lints]
workspace = true
