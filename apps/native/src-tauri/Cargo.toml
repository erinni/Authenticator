[package]
name = "authenticator-native"
description = "App desktop (Tauri 2): il core gira nativo, la UI è quella della PWA."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "authenticator_native"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", default-features = false, features = ["config-json"] }

[dependencies]
authenticator-core.workspace = true
authenticator-session = { path = "../../../crates/session" }
serde = { version = "1.0.229", default-features = false, features = ["derive", "std"] }
# Senza "dynamic-acl": i permessi sono risolti alla compilazione e non modificabili a runtime.
tauri = { version = "2.12.5", default-features = false, features = ["wry", "compression", "common-controls-v6", "x11"] }
getrandom = "0.4.3"
zeroize = "1.9.1"
# Aggiornamenti firmati (minisign) dalle release di GitHub.
# Senza "zip": gli installer di Tauri 2 non sono archivi, e il crate zip ha advisory aperte.
tauri-plugin-updater = { version = "2.14.0", default-features = false, features = ["rustls-tls", "system-proxy"] }
serde_json = "1.0.154"
# Appunti: senza le funzioni per le immagini.
arboard = { version = "3.7.0", default-features = false }

# Sblocco con il sistema: Windows Hello (chiave nel TPM) e Secret Service su Linux.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Foundation", "Security_Credentials", "Security_Cryptography", "Storage_Streams"] }

[target.'cfg(target_os = "linux")'.dependencies]
secret-service = { version = "5.2.0", default-features = false, features = ["rt-tokio-crypto-rust"] }
# Cattura dello schermo tramite il portale XDG (Wayland e X11).
ashpd = { version = "0.13.13", default-features = false, features = ["tokio", "screenshot"] }
png = "0.18.1"
url = "2.5.8"

# Cattura diretta dei monitor su Windows e macOS.
[target.'cfg(not(target_os = "linux"))'.dependencies]
xcap = "0.9.8"

[lints]
workspace = true
