[package]
name = "authenticator-import"
description = "Import degli account da altri authenticator."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
authenticator-core.workspace = true
zeroize = "1.9.1"
aes-gcm = { version = "0.11.1", default-features = false, features = ["aes", "alloc"] }
hmac = "0.13.0"
rqrr = { version = "0.11.0", default-features = false }
pbkdf2 = { version = "0.13.0", default-features = false, features = ["hmac"] }
scrypt = { version = "0.12.0", default-features = false }
serde = { version = "1.0.229", default-features = false, features = ["derive", "std"] }
serde_json = { version = "1.0.154", default-features = false, features = ["std"] }
sha1 = { version = "0.11.0", default-features = false }
sha2 = { version = "0.11.1", default-features = false }

[dev-dependencies]
proptest = "1.12.0"
qrcode = { version = "0.14.1", default-features = false }
