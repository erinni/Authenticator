# Configurazione cargo-deny: advisories (RustSec), licenze, crate vietati, sorgenti.
[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
  # proc-macro-error (non mantenuto): macro di compilazione usata da gtk-rs 0.18, tramite
  # Tauri su Linux. Nessun codice a runtime e nessuna alternativa finché Tauri usa GTK 3.
  { id = "RUSTSEC-2024-0370", reason = "macro di build di gtk-rs (Tauri su Linux), nessun aggiornamento disponibile" },
  # zvariant, zvariant_derive, zbus_names: non più pubblicati a parte perché confluiti in zbus 6.
  # Nessuna vulnerabilità; arrivano da secret-service (zbus 5), usato su Linux per il portachiavi.
  { id = "RUSTSEC-2026-0370", reason = "zvariant confluito in zbus 6; secret-service usa ancora zbus 5" },
  { id = "RUSTSEC-2026-0371", reason = "zbus_names confluito in zbus 6; secret-service usa ancora zbus 5" },
  { id = "RUSTSEC-2026-0372", reason = "zvariant_derive confluito in zbus 6; secret-service usa ancora zbus 5" },
]

[licenses]
version = 2
confidence-threshold = 0.93
unused-allowed-license = "allow"
# Solo licenze compatibili con GPL-3.0 (e AGPL-3.0 per il server).
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  # Boost Software License (appunti su Windows, via arboard): permissiva, compatibile con GPL-3.0.
  "BSL-1.0",
  "Unicode-3.0",
  "CC0-1.0",
  "MPL-2.0",
  "GPL-3.0-only",
  "GPL-3.0-or-later",
  "AGPL-3.0-only",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
deny = [
  # Crittografia: usiamo esclusivamente le implementazioni RustCrypto/dalek.
  { crate = "openssl", reason = "usare rustls e RustCrypto" },
  { crate = "openssl-sys", reason = "usare rustls e RustCrypto" },
  { crate = "rust-crypto", reason = "non mantenuto" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
